<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e10">
  <meta name="description" content="Lights Out: a private F1 2027 prediction league for friends.">
  <title>Lights Out | F1 2027 friends league</title>
  <link rel="icon" href="data:,">
  <script>document.documentElement.className += " js";</script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="site-chrome.css">
  <link rel="stylesheet" href="lights-out.css">
  <link rel="stylesheet" href="home.css">
</head>
<body class="lo">
  <script src="site-nav.js"></script>
  <main>
    <section class="hero-lo" id="hero" aria-label="Next Grand Prix">
      <div class="scene" aria-hidden="true">
        <div class="sky"></div>
        <svg class="circuit" id="hero-circuit" viewBox="0 0 600 380" preserveAspectRatio="xMidYMid meet" focusable="false">
          <path class="c-under" id="c-under" pathLength="1" d=""/>
          <path class="c-line" id="c-line" pathLength="1" d=""/>
          <line class="c-start" id="c-start" x1="0" y1="0" x2="0" y2="0"/>
        </svg>
        <svg class="motif" id="hero-motif" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMax slice" focusable="false"></svg>
        <div class="ground"></div>
        <div class="kerb"></div>
        <div class="grain"></div>
      </div>

      <div class="hero-in">
        <figure class="plate" id="hero-plate">
          <img id="hero-photo" alt="" decoding="async">
          <figcaption class="plate-cap"><span id="plate-where"></span><span id="plate-round"></span></figcaption>
        </figure>
        <div class="hero-text" id="hero-content">
          <p class="placeholder">Loading the next race...</p>
        </div>

        <div class="hero-side">
          <div class="gantry-wrap">
            <svg viewBox="0 0 420 118" focusable="false" aria-hidden="true">
              <g class="gantry">
                <rect x="0" y="6" width="420" height="16" fill="#2a2e34"/>
                <rect x="0" y="6" width="420" height="2" fill="#4d535b"/>
                <rect x="44" y="22" width="8" height="12" fill="#3a3f46"/>
                <rect x="368" y="22" width="8" height="12" fill="#3a3f46"/>
                <rect x="14" y="32" width="392" height="82" fill="#15171b" stroke="#3a3f46" stroke-width="1.5"/>
                <path d="M104.5 32v82M178.5 32v82M252.5 32v82M326.5 32v82" stroke="#2b2f35" stroke-width="1"/>
                <g class="light"><circle class="lens" cx="60" cy="73" r="24"/><circle class="core" cx="60" cy="73" r="10"/></g>
                <g class="light"><circle class="lens" cx="141" cy="73" r="24"/><circle class="core" cx="141" cy="73" r="10"/></g>
                <g class="light"><circle class="lens" cx="210" cy="73" r="24"/><circle class="core" cx="210" cy="73" r="10"/></g>
                <g class="light"><circle class="lens" cx="279" cy="73" r="24"/><circle class="core" cx="279" cy="73" r="10"/></g>
                <g class="light"><circle class="lens" cx="360" cy="73" r="24"/><circle class="core" cx="360" cy="73" r="10"/></g>
              </g>
            </svg>
            <p class="gantry-label"><span>Start lights</span><span id="lights-count">0 / 5</span></p>
          </div>
          <aside class="rc" id="status-panel" aria-label="Prediction status"></aside>
        </div>
      </div>
    </section>

    <div class="home-grid">
      <section aria-labelledby="schedule-title" data-reveal>
        <div class="sec-head">
          <div>
            <p class="lo-eyebrow">Race weekend</p>
            <h2 id="schedule-title">Schedule</h2>
          </div>
          <p class="sec-note">Your local time</p>
        </div>
        <div id="schedule-rows"><p class="empty">Loading...</p></div>
      </section>

      <section aria-labelledby="standings-title" data-reveal style="--i:1">
        <div class="sec-head">
          <div>
            <p class="lo-eyebrow">The league</p>
            <h2 id="standings-title">Standings</h2>
          </div>
          <p class="sec-note" id="standings-season"></p>
        </div>
        <div id="standings-rows"><p class="empty">Loading...</p></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Unofficial fan project for private use. Not affiliated with Formula 1, the FIA or any team.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.1/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="theme.js"></script>
  <script src="home.js"></script>
  <script src="admin-link.js"></script>
</body>
</html>
