<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e10">
  <title>Predictions | Lights Out</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="site-chrome.css">
  <link rel="stylesheet" href="lights-out.css">
  <link rel="stylesheet" href="account.css">
  <link rel="stylesheet" href="predict.css">
  <link rel="stylesheet" href="predict-lights.css">
  <link rel="stylesheet" href="tiles.css">
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="predict-ui.css">
  <link rel="stylesheet" href="season-picks.css"> <!-- NEW (B2.2) -->
  <link rel="stylesheet" href="predict-changes.css"> <!-- NEW (M3) -->
</head>
<body>
  <script src="site-nav.js"></script>
  <header class="pg-head">
    <div class="pg-head-in">
      <p class="lo-eyebrow">Private friends league</p>
      <h1 class="pg-title">Your <span>Predictions</span></h1>
      <p class="pg-sub" id="pg-context"></p>
    </div>
  </header>

  <main class="account-wrap">
    <section class="panel" id="gate" hidden>
      <h2>Sign in required</h2>
      <p class="placeholder" id="gate-text"></p>
      <div class="actions">
        <a class="btn btn-primary" href="account.html">Go to Account</a>
      </div>
    </section>

    <section class="panel" id="predict-panel" hidden>
      <h2>Make your prediction</h2>
      <p class="placeholder" id="empty-text" hidden>
        No predictions are open right now. They open once the session times are confirmed.
      </p>
      <div id="form-area" hidden>
        <div class="field">
          <label for="session-select">Session</label>
          <select id="session-select"></select>
        </div>

        <div class="deadline-lights" id="deadline-lights" hidden>
          <div class="dl-lights" aria-hidden="true">
            <span class="dl-light"></span>
            <span class="dl-light"></span>
            <span class="dl-light"></span>
            <span class="dl-light"></span>
            <span class="dl-light"></span>
          </div>
          <div class="dl-text">
            <p class="dl-state" id="dl-state"></p>
            <p class="dl-time" id="dl-time"></p>
          </div>
        </div>

        <p class="placeholder" id="lock-info"></p>
        <form id="predict-form" novalidate>
          <div id="pick-fields"></div>
          <div class="action-bar">
            <p class="pick-status" id="pick-status" role="status"></p>
            <button type="submit" class="btn btn-primary" id="save-button">Save prediction</button>
          </div>
        </form>
      </div>
    </section>

    <!-- NEW (B2.2): season picks -->
    <section class="season-card" id="season-card" aria-label="Season picks" hidden>
      <div class="sp-head">
        <h2>Season picks</h2>
        <p class="sp-sub" id="sp-sub"></p>
      </div>
      <p class="sp-state" id="sp-state" role="status"></p>
      <div id="sp-body"></div>
    </section>
    <!-- END NEW (B2.2) -->

    <p class="message" id="pred-message" role="status" aria-live="polite"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.1/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="predict-tiles.js"></script>
  <script src="predict-lights.js"></script>
  <script src="predict-ui.js"></script>
  <script src="season-picks.js"></script> <!-- NEW (B2.2) -->
  <script src="admin-link.js"></script>
</body>
</html>
