<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b10">
  <title>Account | F1 2027 Championship</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="site-chrome.css">
  <link rel="stylesheet" href="account.css">
</head>
<body>
  <script src="site-nav.js"></script>
  <header class="hero">
    <div class="checker" aria-hidden="true"></div>
    <div class="hero-inner">
      <p class="eyebrow">Private friends league</p>
      <h1>Your <span>Account</span></h1>
    </div>
  </header>

  <main class="account-wrap">
    <section class="panel" id="signed-out-view">
      <h2>Sign in or create an account</h2>
      <form id="auth-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password (at least 8 characters)</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary" id="sign-in-button">Sign in</button>
          <button type="button" class="btn" id="sign-up-button">Create account</button>
        </div>
      </form>
    </section>

    <section class="panel" id="signed-in-view" hidden>
      <h2>You are signed in</h2>
      <p class="signed-in-email" id="signed-in-email"></p>

      <p class="placeholder" id="membership-status" role="status"></p>

      <div id="join-section" hidden>
        <h3>Join the friends group</h3>
        <p class="placeholder">Enter a display name and the invite code you were given.</p>
        <form id="join-form" novalidate>
          <div class="field">
            <label for="join-name">Display name (2 to 30 characters)</label>
            <input id="join-name" name="join-name" type="text" maxlength="30" autocomplete="nickname" required>
          </div>
          <div class="field">
            <label for="join-code">Invite code</label>
            <input id="join-code" name="join-code" type="text" autocomplete="off" autocapitalize="characters" required>
          </div>
          <div class="actions">
            <button type="submit" class="btn btn-primary" id="join-button">Join group</button>
          </div>
        </form>
      </div>

      <div id="member-section" hidden>
        <p>Group: <strong id="member-group"></strong></p>
        <p>Display name: <strong id="member-name"></strong></p>
        <p>Role: <strong id="member-role"></strong></p>
      </div>

      <div class="actions">
        <button type="button" class="btn" id="sign-out-button">Sign out</button>
      </div>
    </section>

    <p class="message" id="auth-message" role="status" aria-live="polite"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.1/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="account.js"></script>
  <script src="admin-link.js"></script>
</body>
</html>
